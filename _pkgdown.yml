authors:
  Lennart Oelschläger:
    href: https://loelschlaeger.de
  Dietmar Bauer:
    href: https://de.wikipedia.org/wiki/Dietmar_Bauer

template:
  bootstrap: 5
  bslib:
    primary: "#0054AD"
    border-radius: 0.5rem
