  contents:
  - print.RprobitB_fit
  - summary.RprobitB_fit
  - print.summary.RprobitB_fit
  - latent_class_diagnostics
  - coef.RprobitB_fit
  - vcov.RprobitB_fit
  - confint.RprobitB_fit
  - interpret
  - as_draws.RprobitB_fit
  - plot.RprobitB_fit
- title: Prediction and accessors
  desc: Predict choices, inspect residuals, and extract fitted model information.
  contents:
  - predict.RprobitB_fit
  - residuals.RprobitB_fit
  - train_test
  - formula.RprobitB_fit
  - model.frame.RprobitB_fit
  - nobs.RprobitB_fit
  - logLik.RprobitB_fit
- title: Bayesian model evaluation
  desc: Compare predictive performance and model evidence.
